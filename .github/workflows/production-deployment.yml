name: production-deployment
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      H: mentoracademy23p@${{ secrets.DEPLOY_HOST }}
      DOCROOT: /var/www/clients/client8/web30/web/laragenie/public
      SRC: ./            # plain site: deploy the repo files as they are (Next.js: out/)
    steps:
      - uses: actions/checkout@v4

      # --- Next.js only: re-enable when the project has package.json / next.config.* ---
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: npm
      # - name: Build static export
      #   run: |
      #     npm ci
      #     npm run build                      # next.config: output: 'export' → out/
      #     test -f out/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build TypeScript
        run: |
          npm ci
          npm run build                        # src/*.ts -> js/*.js
          test -f js/redirect.js

      - name: Version stamp
        run: |
          echo "V=$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # Next.js: V=$(node -p "require('./package.json').version")-${GITHUB_SHA::7}
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -Is)" > version.json
          test -f index.html

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload to a new release directory
        run: |
          ssh "$H" "mkdir -p ~/deploy/releases/$V"
          rsync -az --delete --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='node_modules' --exclude='src' --exclude='package.json' --exclude='package-lock.json' --exclude='tsconfig.json' --exclude='.gitignore' "$SRC" "$H:deploy/releases/$V/"

      - name: Backup current site
        run: |
          ssh "$H" "mkdir -p ~/deploy/backups && tar -czf ~/deploy/backups/site_\$(date +%F_%H%M).tar.gz -C $DOCROOT . && ls -1t ~/deploy/backups | head -1"

      - name: Activate release into document root
        # Copies the new release into the docroot and records which release is
        # live (~/deploy/current) and which one it replaced (~/deploy/previous).
        run: |
          ssh "$H" "bash -s -- '$V' '$DOCROOT'" <<'EOF'
          set -euo pipefail
          V="$1"; DOCROOT="$2"; D="$HOME/deploy"
          NEW="$D/releases/$V"
          test -f "$NEW/index.html"
          if [ -L "$D/current" ]; then
            OLD="$(readlink -f "$D/current")"
          else
            # first run with pointers: the newest other release was the live one
            OLD="$(ls -1dt "$D"/releases/*/ | sed 's:/*$::' | grep -vxF "$NEW" | head -1 || true)"
          fi
          rsync -a --checksum --delete --exclude='.htaccess' --exclude='.well-known/' "$NEW/" "$DOCROOT/"
          if [ -n "$OLD" ] && [ "$OLD" != "$NEW" ]; then ln -sfn "$OLD" "$D/previous"; fi
          ln -sfn "$NEW" "$D/current"
          echo "current : $(basename "$(readlink -f "$D/current")")"
          if [ -L "$D/previous" ]; then echo "previous: $(basename "$(readlink -f "$D/previous")")"; else echo "previous: none"; fi
          EOF

      - name: Verify
        run: |
          curl -fsS "${{ vars.SITE_URL }}/version.json" | grep -q "$GITHUB_SHA"
          curl -fsS -o /dev/null -w "%{http_code}\n" "${{ vars.SITE_URL }}/"

      - name: Prune old releases and backups (keep 5, never current/previous)
        run: |
          ssh "$H" bash -s <<'EOF'
          set -euo pipefail
          D="$HOME/deploy"
          keep="$(readlink -f "$D/current" 2>/dev/null || true; readlink -f "$D/previous" 2>/dev/null || true)"
          ls -1dt "$D"/releases/*/ | sed 's:/*$::' | tail -n +6 | { grep -vxF "$keep" || true; } | xargs -r rm -rf
          ls -1t "$D"/backups/*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f || true
          echo "releases kept:"; ls -1t "$D/releases"
          EOF
