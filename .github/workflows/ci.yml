name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --- Not needed for a plain HTML/CSS/JS site (no package.json). Re-enable for Next.js. ---
      # - uses: actions/setup-node@v4
      #   with: { node-version: 20, cache: npm }
      # - run: npm ci
      # - run: npm run lint
      # - run: npx --yes html-validate "**/*.html"          # HTML validation (node is preinstalled on the runner)

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: test -f index.html          # plain site: the entry page must exist at the repo root
      - run: test -f js/redirect.js      # proves the TypeScript redirect was compiled
